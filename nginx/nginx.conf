# Highly Optimized Nginx Configuration for Redlix Secure Proctoring
# Engineered for High Concurrency (200-500+ Active Examinees)

worker_processes auto;
worker_rlimit_nofile 10000;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll; # Efficient connection processing (fallback to kqueue on macOS automatically)
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging setup (Highly structured, optimized for performance)
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main_ext buffer=32k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # Basic performance tuning options
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 500;
    types_hash_max_size 2048;
    server_tokens off; # Suppress version info for security

    # Connection and Request Rate Limiting
    # 10MB zone allows tracking ~160,000 unique IP addresses
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

    # File uploads & Base64 live feed snapshots buffer configuration
    # Set max upload size to 10M to allow high-resolution compressed webcam frames
    client_max_body_size 10M;
    client_body_buffer_size 512k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compression (Reduces bandwidth significantly on static resources)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Next.js Upstream Server Group
    upstream nextjs_backend {
        server 127.0.0.1:3000;
        
        # Keepalive connections pool to avoid TCP socket exhaustions under heavy concurrent examinees load
        keepalive 128;
    }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _; # Catch-all server name

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:;" always;

        # Limit connections to max 50 concurrent sockets per IP
        limit_conn conn_limit_zone 50;

        # Direct Static Asset Offloading & Caching
        # Offload Next.js build assets directly to Nginx static cache rules
        location /_next/static/ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Browser cache setup
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            
            # Allow clean resource loading
            access_log off;
        }

        # Cache public images, icons, and logo assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp)$ {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
            access_log off;
        }

        # Apply Rate Limiting to Sensitive Proxy Endpoints (like sessions, webcam snapshot updates, and authentication)
        location /api/ {
            limit_req zone=api_limit_zone burst=50 nodelay;
            
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            
            # Optimized reverse proxy buffers for base64 JSON payload uploads
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Pass realistic headers to Next.js backend for IP geolocation and rate limit validations
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-All location for the Next.js Application
        location / {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            
            # Upgrade headers for WebSockets support (needed for Next.js hot reload / dev servers / real-time links)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reverse proxy timeouts to handle long polling or slow client queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Custom Error Pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
